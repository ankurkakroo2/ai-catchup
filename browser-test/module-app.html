<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI CatchUp - Real App Browser</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Courier New', monospace;
        background: #000;
        color: #fff;
        overflow: hidden;
      }

      #root {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      #scroll-info {
        position: fixed;
        top: 10px;
        right: 10px;
        background: #2d2d2d;
        color: #98c379;
        padding: 10px 15px;
        border-radius: 5px;
        font-size: 12px;
        z-index: 1000;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }

      #scroll-info.warning {
        color: #e06c75;
      }

      #app-container {
        flex: 1;
        overflow: hidden;
        position: relative;
      }

      #terminal-wrapper {
        width: 100%;
        height: 100%;
        overflow-y: auto !important;
        overflow-x: hidden !important;
        scroll-behavior: auto !important;
      }

      /* Custom scrollbar */
      #terminal-wrapper::-webkit-scrollbar {
        width: 10px;
      }

      #terminal-wrapper::-webkit-scrollbar-track {
        background: #1e1e1e;
      }

      #terminal-wrapper::-webkit-scrollbar-thumb {
        background: #4b5363;
        border-radius: 5px;
      }

      #terminal-wrapper::-webkit-scrollbar-thumb:hover {
        background: #5c6370;
      }
    </style>
  </head>
  <body>
    <div id="scroll-info">Loading...</div>
    <div id="root">
      <div id="app-container">
        <div id="terminal-wrapper"></div>
      </div>
    </div>

    <script type="module">
      import { mount } from '/browser-test/ink-web-lib/index.js';

      const scrollInfo = document.getElementById('scroll-info');

      function updateScrollInfo() {
        const wrapper = document.getElementById('terminal-wrapper');
        if (!wrapper) return;

        const scrollTop = wrapper.scrollTop;
        const maxScroll = wrapper.scrollHeight - wrapper.clientHeight;
        const percent = maxScroll > 0 ? ((scrollTop / maxScroll) * 100).toFixed(1) : 0;

        if (scrollTop < 50) {
          scrollInfo.textContent = `Top (${percent}%)`;
          scrollInfo.className = '';
        } else if (scrollTop >= maxScroll - 50) {
          scrollInfo.textContent = `Bottom (${percent}%)`;
          scrollInfo.className = 'warning';
        } else {
          scrollInfo.textContent = `Middle (${percent}%)`;
          scrollInfo.className = '';
        }
      }

      function forceScrollToTop() {
        console.log('🔧 Forcing scroll to top...');

        const wrapper = document.getElementById('terminal-wrapper');
        const appContainer = document.getElementById('app-container');
        const root = document.getElementById('root');

        wrapper.scrollTop = 0;
        appContainer.scrollTop = 0;
        root.scrollTop = 0;
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;

        void wrapper.offsetHeight;

        requestAnimationFrame(() => {
          wrapper.scrollTop = 0;
          appContainer.scrollTop = 0;
          root.scrollTop = 0;
          document.documentElement.scrollTop = 0;
          document.body.scrollTop = 0;

          setTimeout(() => {
            if (wrapper) wrapper.scrollTop = 0;
          }, 50);
          setTimeout(() => {
            if (wrapper) wrapper.scrollTop = 0;
          }, 100);
          setTimeout(() => {
            if (wrapper) wrapper.scrollTop = 0;
            updateScrollInfo();
            console.log('✓ Scroll reset complete');
          }, 200);
        });
      }

      let checkCount = 0;
      const maxChecks = 30;

      function maintainScrollPosition() {
        const wrapper = document.getElementById('terminal-wrapper');
        if (!wrapper || checkCount >= maxChecks) return;

        checkCount++;

        if (wrapper.scrollTop > 50) {
          console.warn(`⚠️  Scroll drifted to ${wrapper.scrollTop}px, resetting...`);
          wrapper.scrollTop = 0;
        }

        updateScrollInfo();
        setTimeout(maintainScrollPosition, 100);
      }

      try {
        console.log('✓ InkWeb module loaded, mounting app...');

        mount({
          element: document.getElementById('terminal-wrapper'),
          scriptUrl: '/dist/index.js',
          args: ['news', '--limit', '10'],
          onLoad: () => {
            console.log('✓ App loaded, forcing scroll to top...');
            forceScrollToTop();
            setTimeout(maintainScrollPosition, 500);
          },
          onError: err => {
            console.error('❌ App error:', err);
            scrollInfo.textContent = `Error: ${err.message}`;
            scrollInfo.className = 'warning';
          },
        });
      } catch (err) {
        console.error('❌ Failed to mount app:', err);
        scrollInfo.textContent = `Error: ${err.message}`;
        scrollInfo.className = 'warning';
      }
    </script>
  </body>
</html>
