<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI CatchUp - WITHOUT Scroll Fix (Shows Bug)</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Courier New', monospace;
        background: #000;
        color: #fff;
        overflow: hidden;
      }

      #container {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      #header {
        padding: 15px 20px;
        background: #2d2d2d;
        border-bottom: 2px solid #e06c75;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      #header h1 {
        margin: 0;
        font-size: 16px;
        color: #e06c75;
      }

      #controls {
        display: flex;
        gap: 15px;
        align-items: center;
      }

      button {
        padding: 6px 12px;
        background: #3e4451;
        color: #fff;
        border: 1px solid #5c6370;
        border-radius: 4px;
        cursor: pointer;
        font-family: inherit;
      }

      button:hover {
        background: #4b5363;
      }

      #scroll-status {
        font-size: 12px;
        padding: 5px 10px;
        background: #e06c75;
        color: #fff;
        border-radius: 3px;
        font-weight: bold;
      }

      #terminal-container {
        flex: 1;
        overflow: hidden;
        position: relative;
      }

      #terminal {
        width: 100%;
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        background: #1e1e1e;
        padding: 20px;
      }

      #terminal::-webkit-scrollbar {
        width: 10px;
      }

      #terminal::-webkit-scrollbar-track {
        background: #1e1e1e;
      }

      #terminal::-webkit-scrollbar-thumb {
        background: #4b5363;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="header">
        <div>
          <h1>⚠️ BUG: No Scroll Fix Applied</h1>
          <small style="color: #e06c75">Terminal may start at bottom</small>
        </div>
        <div id="controls">
          <button onclick="location.reload()">Reload Bug</button>
          <div id="scroll-status">Loading...</div>
        </div>
      </div>
      <div id="terminal-container">
        <div id="terminal">
          <pre id="content"></pre>
        </div>
      </div>
    </div>

    <script>
      const terminal = document.getElementById('terminal');
      const content = document.getElementById('content');
      const scrollStatus = document.getElementById('scroll-status');

      function updateScrollStatus() {
        const scrollTop = terminal.scrollTop;
        const maxScroll = terminal.scrollHeight - terminal.clientHeight;
        const percent = maxScroll > 0 ? ((scrollTop / maxScroll) * 100).toFixed(1) : 0;

        if (scrollTop < 50) {
          scrollStatus.textContent = `Top (${percent}%)`;
          scrollStatus.style.background = '#98c379';
        } else if (scrollTop >= maxScroll - 50) {
          scrollStatus.textContent = `Bottom (${percent}%)`;
          scrollStatus.style.background = '#e06c75';
        } else {
          scrollStatus.textContent = `Middle (${percent}%)`;
          scrollStatus.style.background = '#e5c07b';
        }
      }

      // Generate content WITHOUT scroll fix
      function loadContent() {
        console.log('📋 Loading content (NO SCROLL FIX)...');

        const items = Array.from(
          { length: 30 },
          (_, i) => `
  ▶ ${i + 1}. AI News Item ${i + 1}
     smol.ai • ${(i + 1) * 2} hours ago
`
        ).join('\n');

        content.textContent = `
╔════════════════════════════════════════════════════════╗
║  AI CatchUp - Latest AI News (30 items)                    ║
╚════════════════════════════════════════════════════════╝
${items}
╔════════════════════════════════════════════════════════╗
║  ↑↓ Navigate • Enter to read • Q to quit                   ║
╚════════════════════════════════════════════════════════╝
      `;

        updateScrollStatus();
      }

      // Monitor scroll
      terminal.addEventListener('scroll', updateScrollStatus);

      // *** NO SCROLL FIX INTENTIONALLY OMITTED ***
      window.addEventListener('load', () => {
        console.log('⚠️  Loading WITHOUT scroll fix...');

        // Simulate what happens when terminal renders:
        // It may auto-scroll to bottom due to async rendering
        setTimeout(() => {
          loadContent();

          // Wait a bit then check scroll
          setTimeout(() => {
            const scrollTop = terminal.scrollTop;
            console.log(`Scroll after render: ${scrollTop}px`);

            if (scrollTop > 100) {
              console.warn('⚠️  BUG CONFIRMED: Scroll not at top');
              console.warn('User would need to manually scroll up');
            } else {
              console.log('✓ No bug observed in this case');
            }

            updateScrollStatus();
          }, 100);
        }, 500);
      });
    </script>
  </body>
</html>
