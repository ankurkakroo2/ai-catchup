<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI CatchUp - Browser Terminal Test</title>
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #fff;
        font-family: 'Courier New', monospace;
        overflow: hidden;
      }

      #container {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      #header {
        padding: 15px 20px;
        background: #1e1e1e;
        border-bottom: 2px solid #333;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      #header h1 {
        margin: 0;
        font-size: 18px;
        color: #61afef;
      }

      #controls {
        display: flex;
        gap: 20px;
        align-items: center;
      }

      #controls button {
        padding: 8px 16px;
        background: #3e4451;
        color: #fff;
        border: 1px solid #5c6370;
        border-radius: 4px;
        cursor: pointer;
        font-family: inherit;
      }

      #controls button:hover {
        background: #4b5363;
      }

      #controls button:active {
        background: #2c323a;
      }

      #scroll-info {
        font-size: 12px;
        color: #98c379;
        padding: 5px 10px;
        background: #2d2d2d;
        border-radius: 3px;
      }

      #scroll-info.warning {
        color: #e06c75;
      }

      #terminal-container {
        flex: 1;
        overflow: hidden;
        position: relative;
      }

      #terminal {
        width: 100%;
        height: 100%;
        padding: 10px;
        overflow-y: auto;
      }

      /* Ensure scroll starts at top */
      #terminal::-webkit-scrollbar {
        width: 10px;
      }

      #terminal::-webkit-scrollbar-track {
        background: #1e1e1e;
      }

      #terminal::-webkit-scrollbar-thumb {
        background: #4b5363;
        border-radius: 5px;
      }

      #terminal::-webkit-scrollbar-thumb:hover {
        background: #5c6370;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="header">
        <div>
          <h1>AI CatchUp - Browser Terminal</h1>
          <small style="color: #abb2bf">Using node process in browser</small>
        </div>
        <div id="controls">
          <div id="scroll-info">Scroll: Not loaded yet</div>
          <button onclick="resetScrollToTop()">Reset to Top</button>
          <button onclick="checkScrollPosition()">Check Position</button>
        </div>
      </div>
      <div id="terminal-container">
        <div id="terminal"></div>
      </div>
    </div>

    <script>
      const terminal = document.getElementById('terminal');
      const scrollInfo = document.getElementById('scroll-info');
      const terminalContainer = document.getElementById('terminal-container');

      // Simulate terminal output
      let terminalContent = '';

      function writeTerminal(text) {
        terminalContent += text + '\n';
        terminal.textContent = terminalContent;
      }

      function clearTerminal() {
        terminalContent = '';
        terminal.textContent = '';
      }

      function resetScrollToTop() {
        terminalContainer.scrollTop = 0;
        window.scrollTo(0, 0);
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
        checkScrollPosition();
        writeTerminal('\n--- Scroll reset to top ---');
      }

      function checkScrollPosition() {
        const scrollY = terminalContainer.scrollTop;
        const maxScroll = terminalContainer.scrollHeight - terminalContainer.clientHeight;
        const scrollPercent = maxScroll > 0 ? ((scrollY / maxScroll) * 100).toFixed(1) : 0;

        scrollInfo.textContent = `Scroll: ${scrollY}px (${scrollPercent}%)`;

        if (scrollY > 50) {
          scrollInfo.classList.add('warning');
          scrollInfo.textContent += ' ⚠️ Not at top!';
        } else {
          scrollInfo.classList.remove('warning');
          scrollInfo.textContent += ' ✓ At top';
        }
      }

      // Monitor scroll
      terminalContainer.addEventListener('scroll', checkScrollPosition);

      // Initialize with AI CatchUp simulation
      function initTerminal() {
        clearTerminal();

        writeTerminal('');
        writeTerminal('╔════════════════════════════════════════════════════════╗');
        writeTerminal('║  AI CatchUp - Latest AI News (20 items)                    ║');
        writeTerminal('╚════════════════════════════════════════════════════════╝');
        writeTerminal('');

        for (let i = 1; i <= 20; i++) {
          writeTerminal(`  ${i}. Test AI News Item ${i}`);
          writeTerminal(`     smol.ai • 2 hours ago`);
          writeTerminal('');
        }

        writeTerminal('');
        writeTerminal('╔════════════════════════════════════════════════════════╗');
        writeTerminal('║  ↑↓ Navigate • Enter to read • Q to quit                   ║');
        writeTerminal('╚════════════════════════════════════════════════════════╝');

        // *** FIX: Reset scroll to top after content is rendered ***
        requestAnimationFrame(() => {
          terminalContainer.scrollTop = 0;
          setTimeout(() => {
            terminalContainer.scrollTop = 0;
            checkScrollPosition();
            writeTerminal('\n--- Scroll position reset to top on load ---');
          }, 100);
        });
      }

      // Initialize on load
      window.addEventListener('load', () => {
        initTerminal();

        // Additional safety check
        setTimeout(() => {
          if (terminalContainer.scrollTop > 50) {
            console.warn('Scroll position not at top, forcing reset');
            terminalContainer.scrollTop = 0;
            checkScrollPosition();
          }
        }, 500);
      });
    </script>
  </body>
</html>
