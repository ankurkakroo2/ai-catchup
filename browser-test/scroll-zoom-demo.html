<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI CatchUp - Scroll Fix Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Courier New', monospace;
        background: #000;
        color: #fff;
        overflow: hidden;
      }

      #container {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      #header {
        padding: 15px 20px;
        background: #2d2d2d;
        border-bottom: 2px solid #3e4451;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      #header h1 {
        margin: 0;
        font-size: 16px;
        color: #61afef;
      }

      #controls {
        display: flex;
        gap: 15px;
        align-items: center;
      }

      #zoom-level {
        font-size: 14px;
        color: #abb2bf;
      }

      button {
        padding: 6px 12px;
        background: #3e4451;
        color: #fff;
        border: 1px solid #5c6370;
        border-radius: 4px;
        cursor: pointer;
        font-family: inherit;
      }

      button:hover {
        background: #4b5363;
      }

      #scroll-status {
        font-size: 12px;
        padding: 5px 10px;
        background: #3e4451;
        border-radius: 3px;
        font-weight: bold;
      }

      #scroll-status.top {
        background: #4b5263;
        color: #98c379;
      }

      #scroll-status.bottom {
        background: #4b5263;
        color: #e06c75;
      }

      #scroll-status.middle {
        background: #4b5263;
        color: #e5c07b;
      }

      #terminal-container {
        flex: 1;
        overflow: hidden;
        position: relative;
      }

      #terminal {
        width: 100%;
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        scroll-behavior: auto;
        background: #1e1e1e;
        padding: 20px;
      }

      #terminal::-webkit-scrollbar {
        width: 10px;
      }

      #terminal::-webkit-scrollbar-track {
        background: #1e1e1e;
      }

      #terminal::-webkit-scrollbar-thumb {
        background: #4b5363;
        border-radius: 5px;
      }

      #terminal::-webkit-scrollbar-thumb:hover {
        background: #5c6370;
      }

      .scroll-debug {
        position: fixed;
        bottom: 10px;
        left: 10px;
        background: #2d2d2d;
        color: #abb2bf;
        padding: 10px;
        border-radius: 5px;
        font-size: 11px;
        font-family: monospace;
        z-index: 1000;
      }

      .news-item {
        padding: 10px;
        margin-bottom: 8px;
        background: #282c34;
        border-left: 3px solid #61afef;
        border-radius: 4px;
      }

      .news-item.selected {
        border-left-color: #e5c07b;
        background: #3b4048;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="header">
        <div>
          <h1>AI CatchUp - Terminal Simulation</h1>
          <small style="color: #abb2bf">Zoom level will affect scroll position visibility</small>
        </div>
        <div id="controls">
          <span id="zoom-level">Zoom: 100%</span>
          <button onclick="setZoom(100)">100%</button>
          <button onclick="setZoom(200)">200%</button>
          <button onclick="setZoom(300)">300%</button>
          <div id="scroll-status">Checking...</div>
        </div>
      </div>
      <div id="terminal-container">
        <div id="terminal">
          <pre id="content"></pre>
        </div>
      </div>
      <div class="scroll-debug">
        <div>scrollTop: <span id="debug-scroll">0</span>px</div>
        <div>scrollHeight: <span id="debug-height">0</span>px</div>
        <div>clientHeight: <span id="debug-client">0</span>px</div>
        <div>Percent: <span id="debug-percent">0</span>%</div>
      </div>
    </div>

    <script>
      const terminal = document.getElementById('terminal');
      const content = document.getElementById('content');
      const scrollStatus = document.getElementById('scroll-status');
      const debugScroll = document.getElementById('debug-scroll');
      const debugHeight = document.getElementById('debug-height');
      const debugClient = document.getElementById('debug-client');
      const debugPercent = document.getElementById('debug-percent');
      const zoomLevel = document.getElementById('zoom-level');

      // Generate simulated news items
      const newsItems = Array.from({ length: 30 }, (_, i) => ({
        id: i + 1,
        title: `AI News Item ${i + 1}: ${['OpenAI', 'Claude', 'GPT', 'LLM', 'Deep Learning'][i % 5]} Update`,
        source: ['smol.ai', 'HackerNews', 'Reddit'][i % 3],
        time: `${(i + 1) * 2} hours ago`,
      }));

      let currentZoom = 100;

      function renderNews() {
        const html = `
╔════════════════════════════════════════════════════════╗
║  AI CatchUp - Latest AI News (${newsItems.length} items)                    ║
╚════════════════════════════════════════════════════════╝

${newsItems
  .map(
    (item, index) => `
  ▶ ${index + 1}. ${item.title}
     ${item.source} • ${item.time}
`
  )
  .join('\n')}

╔════════════════════════════════════════════════════════╗
║  ↑↓ Navigate • Enter to read • Q to quit                   ║
╚════════════════════════════════════════════════════════╝
      `;

        content.textContent = html;
      }

      function updateScrollDebug() {
        const scrollTop = terminal.scrollTop;
        const scrollHeight = terminal.scrollHeight;
        const clientHeight = terminal.clientHeight;
        const maxScroll = scrollHeight - clientHeight;
        const percent = maxScroll > 0 ? ((scrollTop / maxScroll) * 100).toFixed(1) : 0;

        debugScroll.textContent = scrollTop.toFixed(0);
        debugHeight.textContent = scrollHeight.toFixed(0);
        debugClient.textContent = clientHeight.toFixed(0);
        debugPercent.textContent = percent;

        if (scrollTop < 50) {
          scrollStatus.textContent = 'Top';
          scrollStatus.className = 'top';
        } else if (scrollTop >= maxScroll - 50) {
          scrollStatus.textContent = 'Bottom';
          scrollStatus.className = 'bottom';
        } else {
          scrollStatus.textContent = 'Middle';
          scrollStatus.className = 'middle';
        }
      }

      function forceScrollToTop() {
        console.log('🔧 Forcing scroll to top...');

        terminal.scrollTop = 0;

        void terminal.offsetHeight;

        requestAnimationFrame(() => {
          terminal.scrollTop = 0;

          setTimeout(() => {
            terminal.scrollTop = 0;
          }, 50);

          setTimeout(() => {
            terminal.scrollTop = 0;
          }, 100);

          setTimeout(() => {
            terminal.scrollTop = 0;
            updateScrollDebug();
            console.log('✓ Scroll at top');
          }, 200);
        });
      }

      function setZoom(level) {
        currentZoom = level;
        zoomLevel.textContent = `Zoom: ${level}%`;
        document.documentElement.style.zoom = level / 100;

        setTimeout(() => {
          updateScrollDebug();
        }, 100);
      }

      // Monitor scroll
      terminal.addEventListener('scroll', updateScrollDebug);

      // Initialize
      window.addEventListener('load', () => {
        console.log('📋 App loading...');

        renderNews();
        updateScrollDebug();

        console.log('🔧 Applying scroll fix...');
        forceScrollToTop();

        // Safety loop
        let checkCount = 0;
        const maxChecks = 30;

        const interval = setInterval(() => {
          checkCount++;

          if (terminal.scrollTop > 50) {
            console.warn(
              `⚠️  Scroll drifted to ${terminal.scrollTop}px at ${currentZoom}% zoom, resetting...`
            );
            terminal.scrollTop = 0;
          }

          updateScrollDebug();

          if (checkCount >= maxChecks) {
            clearInterval(interval);
            console.log(`✓ Scroll stabilized at top (100% zoom: ${currentZoom}%)`);
          }
        }, 100);
      });

      // Handle window resize
      window.addEventListener('resize', () => {
        updateScrollDebug();
      });
    </script>
  </body>
</html>
