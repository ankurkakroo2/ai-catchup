<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI CatchUp - Browser Test</title>
    <script src="https://unpkg.com/ink-web-cli@0.1.0/dist/index.umd.js"></script>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: #1e1e1e;
        color: #fff;
        font-family: 'Courier New', monospace;
      }

      #container {
        max-width: 1200px;
        margin: 0 auto;
        border: 2px solid #333;
        border-radius: 8px;
        overflow: hidden;
      }

      #terminal {
        width: 100%;
        height: 800px;
        background: #000;
      }

      .info {
        margin-bottom: 20px;
        padding: 15px;
        background: #2d2d2d;
        border-radius: 8px;
      }

      .info h1 {
        margin: 0 0 10px 0;
        color: #61afef;
      }

      .info p {
        margin: 5px 0;
        opacity: 0.8;
      }

      .info code {
        background: #3e4451;
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 14px;
      }

      #scroll-info {
        margin-top: 10px;
        padding: 10px;
        background: #2d2d2d;
        border-radius: 4px;
        font-size: 12px;
        color: #98c379;
      }
    </style>
  </head>
  <body>
    <div class="info">
      <h1>AI CatchUp - Browser Test</h1>
      <p>Using ink-web to run Ink app in browser</p>
      <p>Expected: Scroll position should be at TOP (0) on load</p>
      <p>Controls: Use arrow keys to navigate, Enter to open article, Q to quit</p>
      <div id="scroll-info">Scroll position: Checking...</div>
    </div>

    <div id="container">
      <iframe id="terminal"></iframe>
    </div>

    <script>
      const terminal = document.getElementById('terminal');
      const scrollInfo = document.getElementById('scroll-info');

      // Load ink-web with the bundled app
      const appUrl = 'http://localhost:8080/dist/index.js';
      const args = ['news', '--limit', '10'];

      InkWeb.mount({
        element: terminal,
        scriptUrl: appUrl,
        args: args,
        onLoad: () => {
          console.log('App loaded');

          // Check scroll position after load
          setTimeout(() => {
            checkScrollPosition();
          }, 1000);
        },
      });

      function checkScrollPosition() {
        try {
          // Try to get scroll position from iframe or xterm container
          const scrollY =
            window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop;
          const scrollX =
            window.pageXOffset || document.documentElement.scrollLeft || document.body.scrollLeft;

          scrollInfo.innerHTML = `Scroll position: X=${scrollX}, Y=${scrollY}`;

          if (scrollY > 100) {
            scrollInfo.innerHTML += ' ⚠️ BUG: Scroll not at top!';
            scrollInfo.style.color = '#e06c75';
          } else {
            scrollInfo.innerHTML += ' ✓ At top';
            scrollInfo.style.color = '#98c379';
          }
        } catch (err) {
          scrollInfo.innerHTML = `Error checking scroll: ${err.message}`;
        }
      }

      // Monitor scroll
      window.addEventListener('scroll', () => {
        checkScrollPosition();
      });

      // Initial check
      setTimeout(checkScrollPosition, 500);
    </script>
  </body>
</html>
